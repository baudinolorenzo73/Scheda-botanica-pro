<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chiave delle Pinaceae</title>
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#3F6B4C">
<link rel="icon" href="icons/icon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<style>
:root{
  --bg:#E7ECE5; --surface:#F6F8F3; --surface-2:#DCE3D9; --ink:#1B2620; --ink-2:#4A5A50;
  --line:#BFCBBF; --accent:#8A5A12; --accent-ink:#FFFFFF; --moss:#3F6B4C;
  --ok:#2F6B3F; --ok-bg:#D7E8D8; --err:#9A3324; --err-bg:#F3DCD6;
  --serif:"Iowan Old Style","Palatino Linotype",Palatino,"Noto Serif",Georgia,serif;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101815; --surface:#18231E; --surface-2:#22302A; --ink:#DCE5DC; --ink-2:#9DAEA2;
    --line:#2F3F37; --accent:#E0A94A; --accent-ink:#1A1206; --moss:#8DB598;
    --ok:#9BD3A6; --ok-bg:#1E3527; --err:#F0A193; --err-bg:#3A201B;
  }
}
:root[data-theme="dark"]{
  --bg:#101815; --surface:#18231E; --surface-2:#22302A; --ink:#DCE5DC; --ink-2:#9DAEA2;
  --line:#2F3F37; --accent:#E0A94A; --accent-ink:#1A1206; --moss:#8DB598;
  --ok:#9BD3A6; --ok-bg:#1E3527; --err:#F0A193; --err-bg:#3A201B;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--sans);-webkit-text-size-adjust:100%;padding-bottom:calc(72px + env(safe-area-inset-bottom))}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding:0 16px}
i,.latin{font-family:var(--serif);font-style:italic}

header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;gap:8px;padding-top:10px;padding-bottom:10px}
header h1{font:600 1.25rem/1.1 var(--serif);margin:0;flex:1}
header h1 span{display:block;font:400 .78rem/1.3 var(--sans);color:var(--ink-2);margin-top:2px}
a.icon-btn{text-decoration:none;color:inherit}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;height:40px;min-width:40px;padding:0 10px;display:inline-grid;place-items:center;cursor:pointer;font-size:.85rem}

main{padding:18px 0 24px}
h2{font:600 1.6rem/1.15 var(--serif);margin:0 0 4px}
h3{font:600 1.05rem/1.3 var(--sans);margin:0 0 6px}
p{margin:0 0 10px}
.muted{color:var(--ink-2)}
.small{font-size:.875rem}

/* sentiero */
.trail{list-style:none;margin:0 0 18px;padding:0 0 0 4px}
.trail li{position:relative;padding:0 0 10px 22px;font-size:.9rem;color:var(--ink-2)}
.trail li::before{content:"";position:absolute;left:0;top:6px;width:10px;height:10px;border-radius:50%;background:var(--moss)}
.trail li::after{content:"";position:absolute;left:4.5px;top:18px;bottom:-2px;width:1px;background:var(--line)}
.trail li:last-child::after{display:none}
.trail li.here::before{background:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
.trail li.here{color:var(--ink);font-weight:600}
.trail b{color:var(--ink);font-weight:500}

.step-no{font-size:.85rem;color:var(--ink-2);margin-bottom:2px}
.help{background:var(--surface-2);border-radius:10px;padding:10px 12px;font-size:.9rem;margin:10px 0 14px}

.opts{display:grid;gap:10px}
.opt{display:grid;grid-template-columns:52px 1fr;gap:12px;align-items:center;text-align:left;width:100%;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;cursor:pointer}
.opt:hover{border-color:var(--moss)}
.opt:active{transform:scale(.99)}
.opt svg{width:52px;height:52px;color:var(--moss)}
.opt .glyph{width:52px;height:52px;border-radius:12px;background:var(--surface-2);display:grid;place-items:center;font:600 1.2rem var(--serif);color:var(--moss)}
.opt strong{display:block;font-weight:600;line-height:1.3}
.opt span.d{display:block;font-size:.875rem;color:var(--ink-2);margin-top:2px}

.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:9px 16px;cursor:pointer;font-size:.9rem}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn:disabled{opacity:.45;cursor:default}

/* scheda genere */
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px}
.genus-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.genus-head h2{font-style:italic;font-size:2.2rem}
.badge{font-size:.75rem;border-radius:999px;padding:3px 10px;border:1px solid var(--line);white-space:nowrap;background:var(--surface-2)}
.facts{margin:14px 0 0;display:grid;gap:12px}
.facts div{border-top:1px solid var(--line);padding-top:10px}
.facts dt{font-size:.8rem;color:var(--ink-2);margin-bottom:2px}
.facts dd{margin:0}
.tip{margin-top:14px;border-left:3px solid var(--accent);padding:6px 0 6px 12px}

.genera{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.gen{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:left;cursor:pointer}
.gen .latin{font-size:1.25rem;display:block}
.gen .c{font-size:.82rem;color:var(--ink-2)}

/* ripasso */
.clue{font:1.15rem/1.45 var(--serif);margin:10px 0 14px}
.answers{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ans{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;cursor:pointer;text-align:left}
.ans.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
.ans.bad{background:var(--err-bg);border-color:var(--err);color:var(--err)}
.ans:disabled{cursor:default}
.feedback{margin-top:12px;border-radius:10px;padding:10px 12px;font-size:.92rem}
.feedback.ok{background:var(--ok-bg);color:var(--ok)}
.feedback.bad{background:var(--err-bg);color:var(--err)}
.score{font-variant-numeric:tabular-nums}

/* glossario */
details{border-top:1px solid var(--line);padding:10px 0}
details:last-of-type{border-bottom:1px solid var(--line)}
summary{cursor:pointer;font-weight:600;list-style:none;display:flex;justify-content:space-between}
summary::after{content:"+";color:var(--ink-2)}
details[open] summary::after{content:"–"}
details p{margin:6px 0 0;font-size:.92rem}
.fix{list-style:none;padding:0;margin:10px 0 0;display:grid;gap:10px}
.fix li{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:.92rem}
.fix li b{display:block;font-weight:600;margin-bottom:2px}

/* tab bar */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .wrap{display:grid;grid-template-columns:repeat(4,1fr);padding:0}
nav.tabs button{background:none;border:0;padding:10px 4px 12px;cursor:pointer;font-size:.8rem;color:var(--ink-2);display:grid;justify-items:center;gap:3px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--accent);font-weight:600}

/* schema */
dialog{border:0;padding:0;width:min(96vw,1000px);max-height:92vh;border-radius:14px;background:var(--surface);color:var(--ink)}
dialog::backdrop{background:rgb(0 0 0 / .6)}
.dlg-head{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
.dlg-head h3{flex:1;margin:0}
.dlg-body{overflow:auto;max-height:calc(92vh - 110px);background:#000}
.dlg-body img{display:block;width:100%;height:auto}
.dlg-body.zoom img{width:1448px;max-width:none}
.dlg-foot{padding:8px 12px;font-size:.8rem;color:var(--ink-2)}


/* illustrazioni */
:root{--il-leaf:#3F6B4C;--il-leaf2:#86A85C;--il-bark:#7A5236;--il-bark2:#A8744A;--il-grey:#AEB3AC;--il-greyd:#5E605B;--il-greyb:#8A7E72;--il-cone:#9A6A3A;--il-dark:#2E1F15;--il-line:#1B2620;--il-hi:#FFFFFF;--il-red:#B3665A;--il-bg:var(--surface-2)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--il-leaf:#7FAE8B;--il-leaf2:#B8CF7E;--il-bark:#9A6E4D;--il-bark2:#C08F62;--il-grey:#9DA39B;--il-greyd:#6B6E68;--il-greyb:#8C8074;--il-cone:#C08A52;--il-dark:#1A120C;--il-line:#DCE5DC;--il-hi:#EEF3EC;--il-red:#D08A7C}}
:root[data-theme="dark"]{--il-leaf:#7FAE8B;--il-leaf2:#B8CF7E;--il-bark:#9A6E4D;--il-bark2:#C08F62;--il-grey:#9DA39B;--il-greyd:#6B6E68;--il-greyb:#8C8074;--il-cone:#C08A52;--il-dark:#1A120C;--il-line:#DCE5DC;--il-hi:#EEF3EC;--il-red:#D08A7C}
.ill-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
@media (min-width:640px){.ill-grid{grid-template-columns:repeat(4,1fr)}}
.ill{margin:0;background:var(--surface-2);border-radius:12px;padding:8px 8px 10px}
.ill svg{display:block;width:100%;height:auto}
.ill figcaption{font-size:.78rem;line-height:1.35;color:var(--ink-2);margin-top:4px}
.ill figcaption b{display:block;color:var(--ink);font-weight:600;font-size:.82rem}
.ill-note{margin:8px 0 0}
.slides{margin-top:16px;border-top:1px solid var(--line);padding-top:10px}
.slides dl{margin:0}
.slides dd{margin:0}
.slides dt{font-size:.8rem;color:var(--ink-2);margin-bottom:6px}
.slide-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.slide-th{padding:0;border:1px solid var(--line);border-radius:10px;background:var(--surface-2);cursor:pointer;overflow:hidden;text-align:left;display:block}
.slide-th img{display:block;width:100%;height:auto;aspect-ratio:900/507;object-fit:cover}
.slide-th span{display:block;font-size:.78rem;line-height:1.3;padding:5px 7px}
.dlg-nav{display:flex;gap:8px;padding:8px 12px;border-top:1px solid var(--line)}
.dlg-nav .btn{flex:1}
@media (prefers-reduced-motion: reduce){*{transition:none!important}.opt:active{transform:none}}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <a class="icon-btn" href="index.html" aria-label="Torna a Scheda Botanica" title="Torna a Scheda Botanica">←</a>
    <h1>Chiave delle Pinaceae<span>7 generi: Abies, Picea, Pinus, Cedrus, Larix, Tsuga, Pseudotsuga</span></h1>
    <button class="icon-btn" id="themeBtn" type="button" aria-label="Cambia tema"></button>
  </div>
</header>

<main class="wrap" id="app" aria-live="polite"></main>
<p class="wrap small muted" style="text-align:center">by Lollo ®2026 · Scheda Botanica PRO</p>

<nav class="tabs" aria-label="Sezioni">
  <div class="wrap">
    <button type="button" data-view="chiave"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 3v18M12 9l-5-3M12 9l5-3M12 15l-6-3M12 15l6-3"/></svg>Chiave</button>
    <button type="button" data-view="generi"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 3l6 8h-3l4 6H5l4-6H6z"/><path d="M12 17v4"/></svg>Generi</button>
    <button type="button" data-view="ripasso"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.3-1 .9-1 1.7M12 17h.01"/></svg>Ripasso</button>
    <button type="button" data-view="glossario"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M5 4h10a4 4 0 0 1 4 4v12H9a4 4 0 0 1-4-4z"/><path d="M9 9h6M9 13h6"/></svg>Glossario</button>
  </div>
</nav>

<dialog id="schemaDlg">
  <div class="dlg-head">
    <h3>Schema del corso</h3>
    <button class="icon-btn" type="button" id="zoomBtn">Ingrandisci</button>
    <button class="icon-btn" type="button" id="closeDlg" aria-label="Chiudi">✕</button>
  </div>
  <div class="dlg-body" id="dlgBody"><img id="schemaImg" alt="Schema originale di riconoscimento dei generi di Pinaceae" src="img/pinaceae-schema.jpg"></div>
  <div class="dlg-foot">Schema di partenza. Alcuni caratteri sono stati corretti nella chiave: vedi Glossario › Correzioni allo schema.</div>
</dialog>

<dialog id="slideDlg">
  <div class="dlg-head">
    <h3 id="slideTit">Slide del corso</h3>
    <button class="icon-btn" type="button" id="closeSlide" aria-label="Chiudi">✕</button>
  </div>
  <div class="dlg-body"><img id="slideImg" alt="Slide del corso" src=""></div>
  <div class="dlg-nav">
    <button class="btn" type="button" id="slidePrev">← Precedente</button>
    <button class="btn" type="button" id="slideNext">Successiva →</button>
  </div>
  <div class="dlg-foot" id="slideFoot"></div>
</dialog>

<script>
"use strict";

/* ---------- Chiave ---------- */
const ICONS = {
  sol: '<svg viewBox="0 0 52 52" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 40L44 12"/><path d="M14 35l-5-9M20 30l-5-9M26 26l-5-9M32 21l-5-9M18 38l9 3M24 33l9 3M30 28l9 3M36 23l9 3"/></svg>',
  ciu: '<svg viewBox="0 0 52 52" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M26 46v-8"/><rect x="23" y="33" width="6" height="6" rx="1.5"/><path d="M25 33C22 22 15 14 10 6M27 33c3-11 10-19 15-27"/></svg>',
  maz: '<svg viewBox="0 0 52 52" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 46L46 38"/><circle cx="26" cy="42" r="3"/><path d="M26 39V14M26 39l-9-21M26 39l9-21M26 39L10 24M26 39l16-15M26 39L8 32M26 39l18-7"/></svg>'
};

const KEY = {
  q1: {
    step: 1,
    title: "Come sono disposti gli aghi?",
    help: "Guarda un ramo di almeno due anni, non il germoglio dell'anno: in Larix e Cedrus i getti lunghi portano aghi isolati, i mazzetti stanno sui rami più vecchi.",
    options: [
      { id: "sol", icon: "sol", label: "Solitari", detail: "Un ago per punto, distribuiti lungo il ramo", next: "q2" },
      { id: "ciu", icon: "ciu", label: "In fascetti di 2 o 5", detail: "Aghi uniti alla base, spesso avvolti da una guaina", result: "Pinus" },
      { id: "maz", icon: "maz", label: "In mazzetti fitti", detail: "Decine di aghi su cortissimi rametti a bottone (brachiblasti)", next: "q2m" }
    ]
  },
  q2m: {
    step: 2,
    title: "In inverno ha gli aghi?",
    help: "Se non è inverno: aghi rigidi e scuri con pigna a barile di 5–12 cm indicano Cedrus; aghi morbidi verde chiaro con pigne di 2–4 cm indicano Larix.",
    options: [
      { id: "sempre", glyph: "C", label: "Sì, sempreverde", detail: "Aghi rigidi, pigna eretta a barile 5–12 cm che si sfalda sull'albero", result: "Cedrus" },
      { id: "caduco", glyph: "L", label: "No, resta spoglio", detail: "In autunno ingiallisce; pigne erette di 2–4 cm che restano sui rami per anni", result: "Larix" }
    ]
  },
  q2: {
    step: 2,
    title: "Come si attacca l'ago al ramo?",
    help: "Stacca qualche ago e osserva la base con una lente, poi passa il dito sul ramo nudo.",
    options: [
      { id: "ventosa", glyph: "A", label: "Base allargata a ventosa", detail: "Ago piatto e morbido; staccato lascia una cicatrice tonda e piatta, ramo liscio", result: "Abies" },
      { id: "pulvino", glyph: "P", label: "Su un pulvino legnoso, senza picciolo", detail: "Ago rigido e pungente, a sezione quadrangolare; ramo ruvido come una grattugia", result: "Picea" },
      { id: "picciolo", glyph: "?", label: "Con un breve picciolo", detail: "Ago piatto e morbido che si restringe prima dell'attacco, due bande bianche sotto", next: "q3" }
    ]
  },
  q3: {
    step: 3,
    title: "Com'è la pigna?",
    help: "Senza pigne guarda l'ago: circa 1 cm su ramo ruvido indica Tsuga, 2–3,5 cm su ramo quasi liscio con gemme appuntite indica Pseudotsuga.",
    options: [
      { id: "piccola", glyph: "T", label: "Minuscola, 1,5–3 cm", detail: "Ago 0,8–2 cm, ramo ruvido per piccoli pulvini, cima dell'albero ricadente", result: "Tsuga" },
      { id: "tridente", glyph: "Ps", label: "5–10 cm, con brattee a tridente", detail: "Linguette a tre punte che sporgono tra le squame; ago 2–3,5 cm", result: "Pseudotsuga" }
    ]
  }
};

/* ---------- Generi ---------- */
const GENERA = {
  Abies: {
    comune: "Abete bianco", status: "Autoctono",
    specie: "A. alba; A. nebrodensis, endemica delle Madonie (Sicilia), con pochissimi individui.",
    aghi: "Piatti, 1,5–3 cm, apice smussato o lievemente intaccato, non pungenti; due bande bianche sotto. Base allargata a ventosa, senza picciolo.",
    rametto: "Liscio: l'ago staccato lascia una cicatrice tonda e piatta.",
    strobilo: "Eretto, 10–20 cm, sui rami più alti. Si sfalda sull'albero: a terra trovi squame sparse, non pigne intere. In A. alba le brattee sporgono tra le squame.",
    altro: "Corteccia grigio-argentea e liscia da giovane.",
    distr: "Alpi e Appennino fino alla Calabria, spesso con faggio e abete rosso. Fascia montana, circa 400–1800 m.",
    confusione: "Picea: ramo ruvido e ago pungente. Pseudotsuga: ago con picciolo e pigna pendula con tridenti.",
    trucco: "Abies = ventosa: ago con base a dischetto, ramo liscio, pigna in piedi come una candela."
  },
  Picea: {
    comune: "Abete rosso, peccio", status: "Autoctono",
    specie: "P. abies.",
    aghi: "Rigidi e pungenti, 1–2,5 cm, a sezione quadrangolare (si rotolano tra le dita), verdi su tutti i lati.",
    rametto: "Ruvido: ogni ago sta su un pulvino legnoso sporgente che resta dopo la caduta.",
    strobilo: "Pendulo, 10–15 cm, all'apice dei rametti dei rami alti. Cade intero a terra.",
    altro: "Corteccia bruno-rossastra a scaglie sottili.",
    distr: "Alpi, dove forma estese peccete; nell'Appennino un relitto naturale a Campolino (Abetone), altrove rimboschimenti. Circa 800–2200 m.",
    confusione: "Abies: ramo liscio e ago morbido. Tsuga: ago piatto con picciolo e pigna di 2 cm.",
    trucco: "Picea punge: ramo come una grattugia, ago quadrato."
  },
  Pinus: {
    comune: "Pino", status: "Autoctono",
    specie: "P. sylvestris, P. mugo, P. cembra, P. nigra (compreso il laricio), P. leucodermis, P. halepensis, P. pinaster, P. pinea (indigenato discusso).",
    aghi: "In fascetti di 2 (quasi tutti i pini italiani) o 5 (pino cembro), lunghi 3–20 cm secondo la specie. Alla base una guaina membranosa: persistente nei pini a 2 aghi, caduca presto nei pini a 5 aghi.",
    rametto: "Sui rami adulti gli aghi sono sempre riuniti in fascetti.",
    strobilo: "Legnoso, squame spesse, 3–15 cm secondo la specie; matura in 2 anni (3 nel pino domestico).",
    altro: "",
    distr: "In tutta Italia, isole comprese: dalle pinete costiere al limite del bosco sulle Alpi, dove cembro e mugo superano i 2000 m.",
    confusione: "Larix e Cedrus: i loro mazzetti contano decine di aghi, non 2 o 5.",
    trucco: "Conta gli aghi uniti alla base: 2 o 5 = Pinus. La guaina aiuta, ma nel cembro può mancare."
  },
  Cedrus: {
    comune: "Cedro", status: "Introdotto",
    specie: "C. atlantica, C. libani, C. deodara.",
    aghi: "Rigidi, 1–3 cm (fino a 5 in C. deodara), sempreverdi; in mazzetti fitti su brachiblasti, isolati sui getti lunghi.",
    rametto: "",
    strobilo: "Eretto, a barile, 5–12 cm. Si sfalda sull'albero come in Abies.",
    altro: "C. atlantica: rami ascendenti, fogliame spesso glauco. C. libani: palchi orizzontali, cima piatta da adulto. C. deodara: cima e rametti ricadenti.",
    distr: "Parchi, ville e viali in tutta Italia; C. atlantica usato anche in rimboschimenti.",
    confusione: "Larix: spoglio d'inverno, aghi morbidi verde chiaro, pigna di 2–4 cm.",
    trucco: "Mazzetto rigido e verde anche a gennaio con pigna a barile = Cedrus."
  },

const ILL = (() => {
  const r1 = n => Math.round(n * 10) / 10;
  const rad = a => a * Math.PI / 180;
  function rng(seed){ return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  const svg = (inner) => `<svg viewBox="0 0 120 120" aria-hidden="true">${inner}</svg>`;
  const ln = (x1, y1, x2, y2, c, w, extra = "") => `<line x1="${r1(x1)}" y1="${r1(y1)}" x2="${r1(x2)}" y2="${r1(y2)}" stroke="var(--il-${c})" stroke-width="${w}" stroke-linecap="round"${extra}/>`;
  const needle = (x, y, ang, len, c, w) => { const dx = Math.cos(rad(ang)) * len, dy = Math.sin(rad(ang)) * len; return ln(x, y, x + dx, y + dy, c, w); };
  const ground = `<line x1="8" y1="112" x2="112" y2="112" stroke="var(--il-line)" stroke-width="1" opacity=".35"/>`;
  const bar = (x, y, px, label) => `<g opacity=".8"><line x1="${x}" y1="${y}" x2="${x + px}" y2="${y}" stroke="var(--il-line)" stroke-width="1.2"/><line x1="${x}" y1="${y - 2}" x2="${x}" y2="${y + 2}" stroke="var(--il-line)"/><line x1="${x + px}" y1="${y - 2}" x2="${x + px}" y2="${y + 2}" stroke="var(--il-line)"/><text x="${x + px / 2}" y="${y - 3.5}" font-size="7" text-anchor="middle" fill="var(--il-line)" font-family="system-ui,sans-serif">${label}</text></g>`;
  const along = (x1, y1, x2, y2, t) => [x1 + (x2 - x1) * t, y1 + (y2 - y1) * t];

  /* sagome a palchi: tip > 0 punte ricadenti, < 0 ascendenti */
  function tiers(n, top, bottom, minW, maxW, tipFn, fill = "leaf"){
    let s = "";
    const h = (bottom - top) / n * 1.7;
    for(let i = 0; i < n; i++){
      const t = n === 1 ? 1 : i / (n - 1), y = top + t * (bottom - top), w = minW + t * (maxW - minW), tip = tipFn(t), yb = y + h * 0.45;
      s += `<path d="M60 ${r1(y - h * 0.7)} L${r1(60 + w)} ${r1(yb + tip)} L${r1(60 + w - 6)} ${r1(yb + 1.5)} L${r1(60 - w + 6)} ${r1(yb + 1.5)} L${r1(60 - w)} ${r1(yb + tip)} Z" fill="var(--il-${fill})" stroke="var(--il-${fill})" stroke-width="1.2" stroke-linejoin="round"/>`;
    }
    return s;
  }

  function scalesRows(cx, y1, y2, w, step, c = "dark", down = false){
    let s = "";
    for(let y = y1, row = 0; y < y2; y += step, row++){
      const off = row % 2 ? step * 0.6 : 0;
      for(let x = cx - w / 2 + off; x < cx + w / 2; x += step * 1.2){
        s += down
          ? `<path d="M${r1(x - step * 0.6)} ${r1(y)} Q${r1(x)} ${r1(y + step * 1.1)} ${r1(x + step * 0.6)} ${r1(y)}" fill="none" stroke="var(--il-${c})" stroke-width=".8"/>`
          : `<path d="M${r1(x - step * 0.6)} ${r1(y + step)} Q${r1(x)} ${r1(y - step * 0.1)} ${r1(x + step * 0.6)} ${r1(y + step)}" fill="none" stroke="var(--il-${c})" stroke-width=".8"/>`;
      }
    }
    return s;
  }

  function barkBox(id, fill, inner){
    return `<defs><clipPath id="${id}"><rect x="22" y="6" width="76" height="108" rx="8"/></clipPath></defs>
      <g clip-path="url(#${id})"><rect x="0" y="0" width="120" height="120" fill="var(--il-${fill})"/>${inner}</g>
      <rect x="22" y="6" width="76" height="108" rx="8" fill="none" stroke="var(--il-line)" stroke-width=".8" opacity=".4"/>`;

  const CAP = {

/* ---------- Stato ---------- */
const state = {
  view: "chiave",
  path: [],            // [{q, o}]
  genus: null,         // scheda aperta dalla vista Generi
  quiz: null
};

function nodeAfter(path){
  if(!path.length) return { q: "q1" };
  const last = path[path.length - 1];
  const opt = KEY[last.q].options.find(o => o.id === last.o);
  return opt.result ? { result: opt.result } : { q: opt.next };
}

function pathTo(genus, q = "q1", acc = []){
  for(const o of KEY[q].options){
    const step = acc.concat({ q, o: o.id });
    if(o.result === genus) return step;
    if(o.next){ const r = pathTo(genus, o.next, step); if(r) return r; }
  }
  return null;
}

function optLabel(p){ return KEY[p.q].options.find(o => o.id === p.o).label; }

function shuffle(a){
  const b = a.slice();
  for(let i = b.length - 1; i > 0; i--){ const j = Math.floor(Math.random() * (i + 1)); [b[i], b[j]] = [b[j], b[i]]; }
  return b;
}

function newQuiz(){ state.quiz = { deck: shuffle(CLUES), i: 0, score: 0, chosen: null }; }

/* ---------- Render ---------- */
const app = document.getElementById("app");

function trailHTML(path, result){
  if(!path.length) return "";
  const items = path.map(p => `<li><b>${optLabel(p)}</b></li>`);
  if(result) items.push(`<li class="here"><span class="latin">${result}</span></li>`);
  return `<ol class="trail" aria-label="Percorso scelto">${items.join("")}</ol>`;
}

function genusCard(g){
  const d = GENERA[g];
  const f = (label, txt) => txt ? `<div><dt>${label}</dt><dd>${fmt(txt)}</dd></div>` : "";
  return `<article class="card">
    <div class="genus-head">
      <div><h2>${g}</h2><p class="muted">${d.comune}</p></div>
      <span class="badge">${d.status}</span>
    </div>
    ${ILL(g).replace(/<figcaption><b>([^<]*)<\/b>([^<]*)<\/figcaption>/g, (m, t, c) => `<figcaption><b>${t}</b>${fmt(c)}</figcaption>`)}
    <dl class="facts">
      ${f("Specie in Italia", d.specie)}
      ${f("Aghi", d.aghi)}
      ${f("Rametto", d.rametto)}
      ${f("Strobilo", d.strobilo)}
      ${f("Altri caratteri", d.altro)}
      ${f("Distribuzione in Italia", d.distr)}
      ${f("Si confonde con", d.confusione)}
    </dl>
    <p class="tip">${fmt(d.trucco)}</p>
    ${slidesHTML(g)}
  </article>`;
}

function slidesHTML(g){
  const L = SLIDES[g] || [];
  if(!L.length) return `<div class="slides"><dl><dt>Slide del corso</dt><dd class="muted small">Nel materiale del corso non ci sono slide di specie di questo genere.</dd></dl></div>`;
  return `<div class="slides"><dl><dt>Slide del corso · ${L.length} ${L.length === 1 ? "specie" : "specie e varietà"}</dt>
    <dd><div class="slide-grid">${L.map(([n, nome], i) => `
      <button type="button" class="slide-th" data-act="slide" data-g="${g}" data-i="${i}" aria-label="Apri la slide: ${nome}">
        <img src="slides/${n}.webp" alt="" loading="lazy" onerror="this.closest('.slide-th').classList.add('manca');this.remove()">
        <span>${fmt(nome)}</span>
      </button>`).join("")}</div></dd></dl></div>`;
}

function fmt(t){ return t ? t.replace(/\b(Abies alba|[A-Z]\. [a-z]+|Abies|Picea|Pinus|Cedrus|Larix|Tsuga|Pseudotsuga)\b/g, "<i>$1</i>") : t; }

function renderChiave(){
  const node = nodeAfter(state.path);
  if(node.result){
    app.innerHTML = trailHTML(state.path, node.result) + genusCard(node.result) + `
      <div class="row">
        <button class="btn" data-act="back">Torna indietro</button>
        <button class="btn primary" data-act="restart">Nuova identificazione</button>
      </div>`;
    return;
  }
  const q = KEY[node.q];
  app.innerHTML = trailHTML(state.path) + `
    <p class="step-no">Passo ${q.step}</p>
    <h2>${q.title}</h2>
    <p class="help">${fmt(q.help)}</p>
    <div class="opts">
      ${q.options.map(o => `
        <button class="opt" data-act="choose" data-o="${o.id}">
          ${o.icon ? ICONS[o.icon] : `<span class="glyph" aria-hidden="true">${o.glyph}</span>`}
          <span><strong>${o.label}</strong><span class="d">${o.detail}</span></span>
        </button>`).join("")}
    </div>
    <div class="row">
      <button class="btn" data-act="back" ${state.path.length ? "" : "disabled"}>Torna indietro</button>
      <button class="btn" data-act="restart" ${state.path.length ? "" : "disabled"}>Ricomincia</button>
      <button class="btn" data-act="schema">Schema del corso</button>
    </div>`;
}

function renderGeneri(){
  if(state.genus){
    app.innerHTML = `<div class="row" style="margin:0 0 12px"><button class="btn" data-act="closeGenus">Tutti i generi</button></div>`
      + genusCard(state.genus)
      + `<div class="row"><button class="btn primary" data-act="toKey" data-g="${state.genus}">Mostra il percorso nella chiave</button></div>`;
    return;
  }
  app.innerHTML = `<h2>Generi</h2><p class="muted small">Tocca un genere per la scheda completa.</p>
    <div class="genera">${Object.keys(GENERA).map(g => `
      <button class="gen" data-act="openGenus" data-g="${g}">
        <span class="latin">${g}</span><span class="c">${GENERA[g].comune}</span>
      </button>`).join("")}</div>`;
}

function renderRipasso(){
  if(!state.quiz) newQuiz();
  const z = state.quiz;
  if(z.i >= z.deck.length){
    app.innerHTML = `<h2>Ripasso completato</h2>
      <p class="clue">Hai risposto correttamente a <span class="score">${z.score} su ${z.deck.length}</span>.</p>
      <div class="row"><button class="btn primary" data-act="quizRestart">Ricomincia il ripasso</button></div>`;
    return;
  }
  const [answer, clue] = z.deck[z.i];
  const done = z.chosen !== null;
  app.innerHTML = `<p class="step-no score">Domanda ${z.i + 1} di ${z.deck.length} · Corrette ${z.score}</p>
    <h2>Quale genere è?</h2>
    <p class="clue">${clue}</p>
    <div class="answers">${Object.keys(GENERA).map(g => {
      let cls = "";
      if(done && g === answer) cls = "ok";
      else if(done && g === z.chosen) cls = "bad";
      return `<button class="ans ${cls}" data-act="answer" data-g="${g}" ${done ? "disabled" : ""}><span class="latin">${g}</span></button>`;
    }).join("")}</div>
    ${done ? `<div class="feedback ${z.chosen === answer ? "ok" : "bad"}">
        ${z.chosen === answer ? "Esatto." : `Era <i>${answer}</i>.`} ${fmt(GENERA[answer].trucco)}
      </div>
      <div class="row"><button class="btn primary" data-act="next">${z.i + 1 < z.deck.length ? "Domanda successiva" : "Vedi il risultato"}</button></div>` : ""}`;
}

function renderGlossario(){
  app.innerHTML = `<h2>Glossario</h2>
    ${GLOSSARIO.map(([t, d]) => `<details><summary>${t}</summary><p>${fmt(d)}</p></details>`).join("")}
    <h2 style="margin-top:28px">Correzioni allo schema</h2>
    <p class="muted small">Punti dello schema del corso modificati nella chiave. All'esame tieni presente anche la versione originale.</p>
    <ul class="fix">${CORREZIONI.map(([t, d]) => `<li><b>${fmt(t)}</b>${fmt(d)}</li>`).join("")}</ul>
    <div class="row"><button class="btn" data-act="schema">Schema del corso</button></div>`;
}

function render(){
  document.querySelectorAll("nav.tabs button").forEach(b => {
    if(b.dataset.view === state.view) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current");
  });
  ({ chiave: renderChiave, generi: renderGeneri, ripasso: renderRipasso, glossario: renderGlossario })[state.view]();
}

function go(view){ state.view = view; render(); window.scrollTo({ top: 0 }); }

/* ---------- Eventi ---------- */
app.addEventListener("click", e => {
  const b = e.target.closest("[data-act]");
  if(!b || b.disabled) return;
  const act = b.dataset.act;
  switch(act){
    case "choose": {
      const q = nodeAfter(state.path).q;
      state.path = state.path.concat({ q, o: b.dataset.o });
      render(); window.scrollTo({ top: 0 });
      break;
    }
    case "back": state.path = state.path.slice(0, -1); render(); break;
    case "restart": state.path = []; render(); break;
    case "schema": openSchema(); break;
    case "slide": openSlide(b.dataset.g, +b.dataset.i); break;
    case "openGenus": state.genus = b.dataset.g; render(); window.scrollTo({ top: 0 }); break;
    case "closeGenus": state.genus = null; render(); break;
    case "toKey": state.path = pathTo(b.dataset.g) || []; state.genus = null; go("chiave"); break;
    case "answer": {
      const z = state.quiz;
      z.chosen = b.dataset.g;
      if(z.chosen === z.deck[z.i][0]) z.score++;
      render();
      break;
    }
    case "next": state.quiz.i++; state.quiz.chosen = null; render(); window.scrollTo({ top: 0 }); break;
    case "quizRestart": newQuiz(); render(); break;
  }
});

document.querySelectorAll("nav.tabs button").forEach(b => b.addEventListener("click", () => {
  if(b.dataset.view === "generi" && state.view === "generi") state.genus = null;
  go(b.dataset.view);
}));

/* ---------- Schema ---------- */
const dlg = document.getElementById("schemaDlg");
const dlgBody = document.getElementById("dlgBody");
const zoomBtn = document.getElementById("zoomBtn");
function openSchema(){
  dlgBody.classList.remove("zoom"); zoomBtn.textContent = "Ingrandisci";
  if(typeof dlg.showModal === "function") dlg.showModal(); else dlg.setAttribute("open", "");
}
zoomBtn.addEventListener("click", () => {
  const z = dlgBody.classList.toggle("zoom");
  zoomBtn.textContent = z ? "Adatta" : "Ingrandisci";
});
document.getElementById("closeDlg").addEventListener("click", () => dlg.close ? dlg.close() : dlg.removeAttribute("open"));
dlg.addEventListener("click", e => { if(e.target === dlg) dlg.close(); });

/* ---------- Slide del corso ---------- */
const slideDlg = document.getElementById("slideDlg");
let slideCur = { g: null, i: 0 };
function openSlide(g, i){
  const L = SLIDES[g];
  if(!L || !L[i]) return;
  slideCur = { g, i };
  const [n, nome] = L[i];
  document.getElementById("slideTit").textContent = nome;
  const img = document.getElementById("slideImg");
  img.alt = "Slide del corso: " + nome;
  img.src = "slides/" + n + ".webp";
  document.getElementById("slideFoot").textContent = `${g} · slide ${i + 1} di ${L.length} (pagina ${n} del corso). Le slide sono quelle del catalogo dell'app: aprile online almeno una volta per averle anche offline.`;
  document.getElementById("slidePrev").disabled = i === 0;
  document.getElementById("slideNext").disabled = i === L.length - 1;
  if(!slideDlg.open){ if(typeof slideDlg.showModal === "function") slideDlg.showModal(); else slideDlg.setAttribute("open", ""); }
}
document.getElementById("slidePrev").addEventListener("click", () => openSlide(slideCur.g, slideCur.i - 1));
document.getElementById("slideNext").addEventListener("click", () => openSlide(slideCur.g, slideCur.i + 1));
document.getElementById("closeSlide").addEventListener("click", () => slideDlg.close ? slideDlg.close() : slideDlg.removeAttribute("open"));
slideDlg.addEventListener("click", e => { if(e.target === slideDlg) slideDlg.close(); });

/* ---------- Tema ---------- */
const THEMES = ["auto", "light", "dark"];
const THEME_LABEL = { auto: "◐ Auto", light: "☀ Chiaro", dark: "☾ Scuro" };
const themeBtn = document.getElementById("themeBtn");
let theme = "auto";
try { theme = localStorage.getItem("pinaceae-theme") || "auto"; } catch(_){}
if(!THEMES.includes(theme)) theme = "auto";
function applyTheme(){
  if(theme === "auto") document.documentElement.removeAttribute("data-theme");
  else document.documentElement.setAttribute("data-theme", theme);
  themeBtn.textContent = THEME_LABEL[theme];
  themeBtn.setAttribute("aria-label", "Tema: " + THEME_LABEL[theme].slice(2) + ". Tocca per cambiare");
}
themeBtn.addEventListener("click", () => {
  theme = THEMES[(THEMES.indexOf(theme) + 1) % THEMES.length];
  try { localStorage.setItem("pinaceae-theme", theme); } catch(_){}
  applyTheme();
});
applyTheme();
/* Collegamento dal catalogo dell'app: pinaceae.html#genere=Larix apre la scheda di quel genere */
(function apriDaLink(){
  const m = /[#&]genere=([A-Za-z]+)/.exec(location.hash);
  if(m && GENERA[m[1]]){ state.view = "generi"; state.genus = m[1]; render(); }
})();
window.addEventListener("hashchange", () => { const m = /[#&]genere=([A-Za-z]+)/.exec(location.hash); if(m && GENERA[m[1]]){ state.view = "generi"; state.genus = m[1]; render(); window.scrollTo({ top: 0 }); } });
render();
</script>
